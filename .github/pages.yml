# GitHub Pages 配置
# 这个文件用于配置 GitHub Pages 的部署设置

# 部署分支
deployment_branch: gh-pages

# 部署目录
deployment_directory: docs/.vitepress/dist

# 自定义域名（可选）
# custom_domain: your-domain.com

# 强制 HTTPS
force_https: true
# 404 页面
# 404_page: 404.html

# 重定向规则（可选）
# redirects:
#   - from: /old-page
#     to: /new-page
#     status: 301
