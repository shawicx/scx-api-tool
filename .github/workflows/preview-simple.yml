name: Preview Documentation (Simple)

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  preview:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build docs
        run: npm run docs:build

      - name: Comment PR with build status
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            // 检查构建是否成功
            const distPath = path.join('docs', '.vitepress', 'dist');
            const buildSuccess = fs.existsSync(distPath);

            if (buildSuccess) {
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `✅ **文档构建成功！**\n\n📖 文档已成功构建，可以在本地运行 \`npm run docs:dev\` 来预览。\n\n🔍 构建输出目录: \`docs/.vitepress/dist\`\n\n💡 提示：合并到 main 分支后，文档将自动部署到 GitHub Pages。`
              });
            } else {
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `❌ **文档构建失败！**\n\n请检查构建日志，修复问题后重新提交。`
              });
            }
